aid: playcanvas
name: PlayCanvas
description: >-
  PlayCanvas is an open-source WebGL/WebGPU 3D engine and cloud platform for
  building games, product configurators, and interactive 3D experiences that run
  in any web browser. It offers a browser-based collaborative Editor, a
  standalone engine on npm/CDN, React components, and Web Components, plus the
  SuperSplat toolchain for Gaussian-splat capture and publishing. PlayCanvas
  exposes a REST API (beta) for automating the platform — managing project
  assets, version-control branches and checkpoints, listing scenes, exporting
  projects, downloading self-hostable apps, polling asynchronous jobs, and
  publishing splats — authenticated with Bearer access tokens over HTTPS.
